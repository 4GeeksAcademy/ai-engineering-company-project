[project]
name = "healthcore-api"
version = "0.3.0"
description = "HealthCore Digital API — incidents, suppliers, and staff authentication (TinyDB)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
  "httpx>=0.27.0",
  "pydantic>=2.9.0",
  "email-validator>=2.0.0",
  "tinydb>=4.8.0",
  "python-jose[cryptography]>=3.3.0",
  "cryptography>=42.0.0,<45",
  "libpass[bcrypt]>=1.9.0",
  "python-dotenv>=1.0.0",
  "resend>=2.0.0",
]

[project.scripts]
seed = "app.seed:main"
seed-auth = "app.auth.seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
