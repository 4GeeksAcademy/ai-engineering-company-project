[project]
name = "healthcore-api"
version = "0.2.0"
description = "HealthCore Digital API — incidents analysis and supplier directory (TinyDB)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
  "httpx>=0.27.0",
  "pydantic>=2.9.0",
  "email-validator>=2.0.0",
  "tinydb>=4.8.0",
]

[project.scripts]
seed = "app.seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
